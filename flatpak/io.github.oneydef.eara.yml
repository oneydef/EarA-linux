# Flathub manifest for EarA
app-id: io.github.oneydef.eara
runtime: org.gnome.Platform
runtime-version: "51"
sdk: org.gnome.Sdk
command: io.github.oneydef.eara

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
  - --system-talk-name=org.bluez
  - --allow=bluetooth

cleanup:
  - /include
  - /lib/pkgconfig
  - /share/aclocal
  - /share/doc
  - /share/gtk-doc
  - /share/man
  - /share/pkgconfig
  - "*.la"

modules:
  - name: python3-dbus-python
    buildsystem: meson
    config-opts:
      - -Dtests=disabled
      - -Ddoc=disabled
      - -Dinstalled_tests=false
    sources:
      - type: archive
        url: https://files.pythonhosted.org/packages/f3/cc/23f24bc7cbfec3a0ab508b7e11bc98837d77a91445d5f666a8545353a147/dbus_python-1.5.1.tar.gz
        sha256: 57423cf87d09b7d084f420b55b737fe654c33339b06df77945620d97795c6ac4

  - name: python3-docutils
    buildsystem: simple
    build-commands:
      - pip3 install --verbose --exists-action=i --no-index --find-links="file://${PWD}"
        --prefix=${FLATPAK_DEST} --no-deps docutils==0.21.2
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/8f/d7/9322c609343d929e75e7e5e6255e614fcc67572cfd083959cdef3b7aad79/docutils-0.21.2-py3-none-any.whl
        sha256: dafca5b9e384f0e419294eb4d2ff9fa826435bf15f15b7bd45723e8ad76811b2

  - name: bluez
    buildsystem: autotools
    no-make-install: true
    config-opts:
      - --enable-library
      - --enable-client
      - --enable-deprecated
      - --disable-systemd
      - --disable-udev
      - --disable-cups
      - --disable-monitor
      - --disable-mesh
      - --disable-hid
      - --disable-hog
      - --disable-health
      - --disable-gatt
      - --disable-obex
      - --disable-nfc
      - --disable-sap
      - --disable-experimental
    build-options:
      cflags: -O2 -g
      cxxflags: -O2 -g
    build-commands:
      - make -C client bluetoothctl
      - make tools/sdptool
      - install -Dm755 client/bluetoothctl ${FLATPAK_DEST}/bin/bluetoothctl
      - install -Dm755 tools/sdptool ${FLATPAK_DEST}/bin/sdptool
    sources:
      - type: archive
        url: https://www.kernel.org/pub/linux/bluetooth/bluez-5.79.tar.xz
        sha256: 4164a5303a9f71c70f48c03ff60be34231b568d93a9ad5e79928d34e6aa0ea8a
        x-checker-data:
          type: anitya
          project-id: 5167
          url-template: https://www.kernel.org/pub/linux/bluetooth/bluez-${version}.tar.xz

  - name: eara
    buildsystem: meson
    sources:
      - type: git
        url: https://github.com/oneydef/eara.git
        commit: 80b56f90eba4d4a8de7b4ef3682cf59ced18c035
