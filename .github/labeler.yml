      - any-glob-to-any-file:
          - eara/bluez.py
          - eara/protocol.py
          - eara/session.py
          - eara/platforms/**
          - tests/test_bluez.py
          - tests/test_protocol.py
          - tests/test_session.py
packaging:
  - changed-files:
      - any-glob-to-any-file:
          - packaging/**
          - scripts/build-*
          - scripts/install-*
          - nfpm.yaml
          - pyproject.toml
          - meson.build
          - .github/workflows/ci.yml
