name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi python3-gi-cairo python3-cairo python3-dbus gir1.2-gtk-4.0 gir1.2-adw-1 xvfb
      - name: Tests
        run: xvfb-run -a python3 -m unittest discover -s tests -v
      - name: GTK controls (no hardware commands)
        env:
          GSETTINGS_BACKEND: memory
          PYTHONDONTWRITEBYTECODE: "1"
        run: xvfb-run -a python3 scripts/verify-ui-controls.py
      - name: GTK motion (frame-clock conditions, no hardware commands)
        env:
          GSETTINGS_BACKEND: memory
          PYTHONDONTWRITEBYTECODE: "1"
        run: xvfb-run -a python3 scripts/verify-motion.py
      - name: Preserve GTK verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gtk-verification
          path: |
            docs/verification/motion/checks.json
            docs/verification/audit/control-checks.json
      - name: i18n key parity (en / uk)
        run: |
          PYTHONPATH=. python3 - <<'PY'
          from eara.i18n import STRINGS

          en = set(STRINGS["en"])
          uk = set(STRINGS["uk"])
          missing_uk = sorted(en - uk)
          missing_en = sorted(uk - en)
          if missing_uk or missing_en:
              if missing_uk:
                  print("Missing in uk:", ", ".join(missing_uk))
              if missing_en:
                  print("Missing in en:", ", ".join(missing_en))
              raise SystemExit(1)
          print(f"i18n ok — {len(en)} keys in en/uk")
          PY
      - name: CLI help
        run: PYTHONPATH=. python3 -m eara --help

  packages:
    needs: test
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      discussions: write
    steps:
      - uses: actions/checkout@v4
      - name: appimagetool
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi python3-gi-cairo python3-cairo python3-dbus gir1.2-gtk-4.0 gir1.2-adw-1
          curl -fsSL -o appimagetool "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x appimagetool
          sudo mv appimagetool /usr/local/bin/appimagetool
          curl -fsSL -o linuxdeploy "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage"
          chmod +x linuxdeploy
          sudo mv linuxdeploy /usr/local/bin/linuxdeploy
      - name: Build .deb, tarball, AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          chmod +x scripts/build-packages.sh packaging/eara
          VERSION=$(PYTHONPATH=. python3 -c 'from eara import __version__; print(__version__)')
          VERSION="$VERSION" ./scripts/build-packages.sh
      - name: RPM (nfpm)
        run: |
          curl -fsSL -o /tmp/nfpm.deb https://github.com/goreleaser/nfpm/releases/download/v2.41.3/nfpm_2.41.3_amd64.deb
          sudo dpkg -i /tmp/nfpm.deb
          python3 scripts/build-rpm.py
      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz
            dist/*.AppImage
      - name: Publish GitHub Release
        if: github.repository == 'oneydef/EarA-linux' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          ASSETS=(dist/*.deb dist/*.rpm dist/*.tar.gz dist/*.AppImage)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            gh release create "$TAG" "${ASSETS[@]}" \
              --title "EarA ${TAG}" \
              --generate-notes
          fi
      - name: Start release discussion
        if: github.repository == 'oneydef/EarA-linux' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          # The tags endpoint returns 404 for a draft release. Resolve draft
          # state through gh first; announce only after publication.
          if [ "$(gh release view "$TAG" --json isDraft,isPrerelease --jq '.isDraft or .isPrerelease')" = "true" ]; then
            exit 0
          fi
          RELEASE_ID=$(gh api "repos/$GH_REPO/releases/tags/$TAG" \
            --jq 'select(.draft == false and .prerelease == false and .discussion_url == null) | .id')
          if [ -n "$RELEASE_ID" ]; then
            gh api --method PATCH "repos/$GH_REPO/releases/$RELEASE_ID" \
              -f discussion_category_name=Announcements --silent
          fi
