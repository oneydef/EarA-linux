name: PR labels

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to label
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    if: github.repository == 'oneydef/EarA-linux'
    runs-on: ubuntu-latest
    steps:
      # Read configuration from the base repository; never execute PR code.
      - uses: actions/labeler@b8dd2d9be0f68b860e7dae5dae7d772984eacd6d # v6
        with:
          pr-number: ${{ inputs.pr_number || github.event.pull_request.number }}
          sync-labels: false
