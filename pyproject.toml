[project]
name = "eara"
version = "0.6.2"
description = "Unofficial Linux companion for compatible True Wireless earbuds"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "oneydef", email = "oneydefwork@gmail.com" }]
keywords = ["nothing", "nothing-x", "nothing-earbuds", "cmf", "earbuds", "bluetooth", "linux", "gtk4", "flatpak", "pipewire", "bluez", "anc"]
classifiers = [
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Sound/Audio",
]
scripts = { eara = "eara.cli:main" }

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["eara*"]

[tool.setuptools.data-files]
"share/eara/packaging" = [
  "packaging/eara",
  "packaging/eara.desktop",
  "packaging/eara.metainfo.xml",
  "packaging/eara.png",
  "packaging/eara.svg",
  "packaging/earbuds-hero.svg",
]
"share/eara/packaging/arch" = ["packaging/arch/PKGBUILD"]
"share/eara/packaging/fonts" = ["packaging/fonts/*.ttf"]
"share/eara/packaging/screenshots" = ["packaging/screenshots/*.png"]
"share/eara/packaging/ui" = ["packaging/ui/*.png", "packaging/ui/README.md"]
"share/eara/packaging/ui/icons" = ["packaging/ui/icons/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
