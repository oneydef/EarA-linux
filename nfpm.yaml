name: eara
arch: all
platform: linux
version: ${VERSION}
section: sound
priority: optional
maintainer: oneydef <oneydefwork@gmail.com>
description: Unofficial Linux companion for compatible True Wireless earbuds
contents:
  - src: eara
    dst: /usr/share/eara/eara
  - src: packaging/eara
    dst: /usr/bin/eara
    file_info:
      mode: 0755
  - src: packaging/eara.desktop
    dst: /usr/share/applications/eara.desktop
  - src: packaging/eara.metainfo.xml
    dst: /usr/share/metainfo/eara.metainfo.xml
  - src: packaging/screenshots
    dst: /usr/share/eara/screenshots
  - src: packaging/fonts
    dst: /usr/share/eara/packaging/fonts
  - src: packaging/ui
    dst: /usr/share/eara/packaging/ui
  - src: packaging/eara.svg
    dst: /usr/share/icons/hicolor/scalable/apps/eara.svg
  - src: LICENSE
    dst: /usr/share/doc/eara/LICENSE
  - src: NOTICE
    dst: /usr/share/doc/eara/NOTICE
overrides:
  deb:
    depends:
      - python3
      - python3-gi
      - python3-gi-cairo
      - python3-cairo
      - python3-dbus
      - gir1.2-gtk-4.0
      - gir1.2-adw-1
      - bluez
      - pulseaudio-utils
  rpm:
    depends:
      - python3
      - python3-dbus
      - python3-gobject
      - python3-cairo
      - gtk4
      - libadwaita
      - bluez
      - pulseaudio-utils
